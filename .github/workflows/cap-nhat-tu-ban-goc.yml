# Cập nhật từ bản gốc – dành cho kho được tạo bằng nút "Deploy to Cloudflare".
# Vào tab Actions → "Cập nhật từ bản gốc" → Run workflow. Cloudflare tự đưa bản mới lên sau khi kho thay đổi.
# Giữ nguyên wrangler.jsonc của đơn vị (tên Worker, cơ sở dữ liệu) – dữ liệu không bị ảnh hưởng.
name: Cập nhật từ bản gốc
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cap-nhat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lấy bản mới nhất từ quantritute/quan-ly-nhan-su
        run: |
          git clone --depth 1 https://github.com/quantritute/quan-ly-nhan-su.git /tmp/goc
          rsync -a --delete --exclude .git --exclude .github --exclude wrangler.jsonc --exclude .dev.vars /tmp/goc/ban-day-du/ ./
          git config user.name "cap-nhat-tu-ban-goc"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Đã là bản mới nhất."; else git commit -m "Cập nhật từ bản gốc $(cat /tmp/goc/ban-day-du/package.json | grep '\"version\"' | head -1 | sed 's/[^0-9.]//g')" && git push; fi
